<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/itens.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>carrinho</title>
  </head>

  <body class="bg-light">
    <div class="container py-4">
      <a
        href="https://jonassouza1.github.io/ecommercejs-frontend-site/"
        class="btn btn-outline-secondary mb-4"
      >
        <i class="fa-solid fa-house me-2"></i> Voltar à loja
      </a>

      <h2 class="mb-4">Seu Carrinho</h2>
      <div id="carrinho" class="row g-4"></div>

      <hr class="my-5" />

      <h3>Informações de Entrega</h3>
      <form id="checkout-form" class="row g-3">
        <div class="col-md-6">
          <label for="name" class="form-label">Nome Completo:</label>
          <input type="text" class="form-control" id="name" required />
        </div>

        <div class="col-md-6">
          <label for="email" class="form-label">E-mail:</label>
          <input type="email" class="form-control" id="email" required />
        </div>

        <div class="col-12">
          <label for="address" class="form-label">Endereço:</label>
          <input type="text" class="form-control" id="address" required />
        </div>

        <div class="col-md-2">
          <label for="street_number" class="form-label">Número:</label>
          <input type="text" class="form-control" id="street_number" required />
        </div>

        <div class="col-md-2">
          <label for="floor" class="form-label">Andar:</label>
          <input
            type="text"
            class="form-control"
            id="floor"
            placeholder="Opcional"
          />
        </div>

        <div class="col-md-2">
          <label for="apartment" class="form-label">Apartamento:</label>
          <input
            type="text"
            class="form-control"
            id="apartment"
            placeholder="Opcional"
          />
        </div>

        <div class="col-md-4">
          <label for="city" class="form-label">Cidade:</label>
          <input type="text" class="form-control" id="city" required />
        </div>

        <div class="col-md-4">
          <label for="state" class="form-label">Estado:</label>
          <input type="text" class="form-control" id="state" required />
        </div>

        <div class="col-md-4">
          <label for="zip" class="form-label">CEP:</label>
          <input
            type="text"
            class="form-control"
            id="zip"
            maxlength="9"
            required
          />
        </div>

        <div class="col-md-6">
          <label for="country_name" class="form-label">País:</label>
          <input type="text" class="form-control" id="country_name" />
        </div>

        <div class="col-md-6">
          <label for="phone" class="form-label">Telefone:</label>
          <input
            type="tel"
            class="form-control"
            id="phone"
            required
            placeholder="(XX) XXXXX-XXXX"
          />
        </div>

        <div class="col-12 text-end">
          <button id="btn" type="submit" class="btn btn-success">
            Comprar
          </button>
        </div>
      </form>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js"
      integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+"
      crossorigin="anonymous"
    ></script>

    <script src="./src/scripts/cart/cart.js" type="module"></script>

    <script src="./src/scripts/payment/createPayment.js" type="module"></script>
  </body>
</html>
