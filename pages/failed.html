<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erro na Compra</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div
      class="text-center p-4 shadow rounded bg-white"
      style="max-width: 500px"
    >
      <i class="fa-solid fa-circle-xmark fa-4x text-danger mb-3"></i>
      <h1 class="mb-3">Ocorreu um erro no pagamento</h1>
      <p class="text-muted">
        Infelizmente não foi possível concluir sua compra. Você pode tentar
        novamente ou entrar em contato com o Mercado Pago.
      </p>
      <a
        href="https://jonassouza1.github.io/ecommercejs-frontend-site/"
        class="btn btn-danger mt-3"
      >
        <i class="fa-solid fa-rotate-left me-2"></i>Voltar e tentar novamente
      </a>
    </div>
  </body>
</html>
