<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido Confirmado</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div
      class="text-center p-4 shadow rounded bg-white"
      style="max-width: 500px"
    >
      <i class="fa-solid fa-circle-check fa-4x text-success mb-3"></i>
      <h1 class="mb-3">Compra realizada com sucesso!</h1>
      <p class="text-muted">
        Obrigado por comprar com a gente. Seu pedido está sendo processado e
        você receberá as atualizações por e-mail.
      </p>
      <a
        href="https://jonassouza1.github.io/ecommercejs-frontend-site/"
        class="btn btn-success mt-3"
      >
        <i class="fa-solid fa-house me-2"></i>Voltar à loja
      </a>
    </div>
  </body>
</html>
