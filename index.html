<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./src/styles/home.css" />
    <title>ecommercejs</title>
  </head>

  <body class="bg-light">
    <header class="bg-dark text-white py-3 position-relative">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row justify-content-center justify-content-md-between align-items-center gap-3"
        >
          <!-- Título centralizado em mobile -->
          <h1 class="h4 m-0 text-center text-md-start">eCommerce JS</h1>

          <!-- Select centralizado em mobile -->
          <div class="w-100 w-md-auto">
            <select
              class="form-select"
              id="categories"
              style="width: 100%; max-width: 200px; margin: 0 auto"
            >
              <option disabled selected>Selecione uma opção</option>
              <option value="">Todos Produtos</option>
              <option value="Camisa">Camisa</option>
              <option value="Calça">Calça</option>
              <option value="Casaco">Casaco</option>
              <option value="Bermuda">Bermuda</option>
              <option value="Roupa Íntima">Roupa Íntima</option>
              <option value="Calçado">Calçado</option>
            </select>
          </div>
        </div>

        <!-- Carrinho fixado no canto superior direito -->
        <div style="position: absolute; top: 25px; right: 15px">
          <a
            href="https://jonassouza1.github.io/ecommercejs-frontend-site/carrinho.html"
            class="text-white position-relative taga"
          >
            <i class="fa-solid fa-cart-shopping fs-4"></i>
            <span
              id="valuecart"
              class="position-absolute translate-middle badge rounded-pill bg-danger"
              style="top: 0; left: 85%"
            >
              0
            </span>
          </a>
        </div>
      </div>
    </header>

    <main class="container my-5">
      <div id="container" class="row g-4"></div>
    </main>

    <script src="./src/scripts/home/rendersItemsHome.js" type="module"></script>
    <script src="./src/scripts/home/addItemsCart.js" type="module"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js"
      integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
